<div class="side-content text-black-50">
  <h2>Requests</h2>
  <ul class="nav nav-pills flex-column mt-1">
    @for (request of requests(); track request; let i = $index) {
    <li>
      <button
        type="submit"
        class="nav-link text-black"
        (click)="setClickedRow(i)"
        [class.active]="i === selectedRow()"
      >
        {{ request.name }}
      </button>
      <hr class="text-black" />
    </li>
    }
  </ul>
</div>
