<div class="side-content text-black-50">
    <h2 class="fs-3 fw-bold text-black pb-2 ">Requests</h2>
  <ul class="nav nav-pills flex-column mt-1">
    <li *ngFor="let request of requests ; let i = index">
      <button type="submit" class="nav-link text-black w-100"
        (click)="setClickedRow(i)" [ngClass]="{'bg-secondary': i == selectedRow, 'active': i == selectedRow}">{{ request.name }}</button>
      <hr class="text-black" />
    </li>
  </ul>
</div>
