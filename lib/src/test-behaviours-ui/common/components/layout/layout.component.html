<app-header></app-header>

<div class="layout container-fluid pt-5">
  <!-- Offcanvas Menu (Mobile Only) -->
  <div
    class="layout__offcanvas offcanvas offcanvas-start d-lg-none"
    tabindex="-1"
    id="sideMenu"
    aria-labelledby="sideMenuLabel"
  >
    <div class="layout__offcanvas-header offcanvas-header">
      <button
        type="button"
        class="btn-close"
        data-bs-dismiss="offcanvas"
        aria-label="Close"
      ></button>
    </div>

    <div class="layout__offcanvas-body offcanvas-body">
      <app-side-menu></app-side-menu>
    </div>
  </div>

  <!-- Main Grid -->
  <div class="layout__grid row">
    <div
      class="layout__sidebar col-lg-2 d-none d-lg-block border-end min-vh-100 pt-5"
    >
      <app-side-menu></app-side-menu>
    </div>

    <div class="layout__content col-12 col-lg-10 pt-1">
      <app-form-pane></app-form-pane>
    </div>
  </div>
</div>
