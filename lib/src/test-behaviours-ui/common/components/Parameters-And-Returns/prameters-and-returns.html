<div class="parameters-and-returns-wrapper mx-4">
  <!-- Title -->
  <div class="parameters-form__title mb-3">
    <h4>Parameters</h4>
  </div>

  <!-- Parameters Form -->
  <form [formGroup]="form" class="parameters-form mb-4">
    <ng-container formArrayName="parameters">
      <div
        *ngFor="let row of parameters.controls; let i = index"
        [formGroupName]="i"
        class="parameters-form__row d-flex align-items-center mb-2 gap-2"
      >
        <!-- Parameter Name Dropdown -->
        <select
          formControlName="paramName"
          class="form-select parameters-form__dropdown mb-2"
          readonly
        >
          <option *ngFor="let p of parametersList" [value]="p">{{ p }}</option>
        </select>

        <!-- Input Field -->
        <!-- Input Field + Error + Hint Messages -->
        <div class="flex-grow-1 d-flex flex-column">
          <!-- Input Field -->
          <input
            class="form-control parameters-form__input mb-1"
            formControlName="value"
            placeholder="Enter value"
          />

          <!-- Error Message -->
          <div
            class="text-danger mt-1 small"
            *ngIf="row.get('value')?.hasError('invalidJson')"
          >
            Please enter a valid JSON object.
          </div>

          <!-- Hint Message Under Input -->
          <div
            class="text-danger mt-1 small"
            *ngIf="row.get('type')?.value === 'Object'"
          >
            Enter a value like: {{ '{' }}"key": "value"{{ '}' }}
          </div>
        </div>

        <!-- Type Dropdown -->
        <select
          formControlName="type"
          class="form-select parameters-form__dropdown mb-2 gap-2"
        >
          <option value="" disabled selected class="text-body">
            Select type
          </option>
          <option *ngFor="let type of typesList" [value]="type">
            {{ type }}
          </option>
        </select>

        <!-- Add / Remove Buttons -->
        <div
          class="parameters-form__actions d-flex gap-1"
          *ngIf="parameters.length > 1"
        >
          <!-- Add Button -->
          <button
            type="button"
            class="btn btn-light btn-sm rounded-circle p-1 d-flex align-items-center justify-content-center border"
            (click)="addRow()"
            title="Add"
          >
            <i class="bi bi-plus"></i>
          </button>

          <!-- Remove Button -->
          <button
            type="button"
            class="btn btn-light btn-sm rounded-circle p-1 d-flex align-items-center justify-content-center border"
            (click)="removeRow(i)"
            [disabled]="parameters.length === 1"
            title="Remove"
          >
            <i class="bi bi-dash"></i>
          </button>
        </div>
      </div>
    </ng-container>
  </form>

  <!-- Response Viewer -->
  <div
    class="response-viewer card p-3 mb-4 shadow-sm border rounded"
    *ngIf="response"
  >
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="mb-0">
        {{ responseView === 'returns' ? 'Returns' : 'Response' }}
      </h5>

      <div class="d-flex align-items-center gap-2">
        <button
          *ngIf="responseView === 'json'"
          class="btn btn-link btn-sm"
          (click)="copyJsonToClipboard()"
          title="Copy to clipboard"
        >
          <i class="fa-solid fa-copy text-secondary fs-5 me-0"></i>
          <span class="visually-hidden">Copy JSON</span>
        </button>
        <span class="badge bg-secondary">Delay: {{ responseTime }} ms</span>

        <select
          class="form-select form-select-sm w-auto"
          [(ngModel)]="responseView"
        >
          <option value="returns">Returns</option>
          <option value="json">JSON</option>
          <option value="tree">Tree</option>
        </select>
      </div>
    </div>

    <!-- JSON View -->
    <pre
      *ngIf="responseView === 'json'"
      class="json-view bg-light text-dark p-3 rounded overflow-auto view__json"
    >
{{ response | json }}
    </pre>

    <!-- Tree View -->
    <div
      *ngIf="responseView === 'tree'"
      class="tree-view bg-light p-3 rounded overflow-auto View__Tree"
    >
      <ngx-json-viewer [json]="response" [expanded]="true"></ngx-json-viewer>
    </div>

    <!-- Returns View -->
    <div
      *ngIf="responseView === 'returns'"
      class="returns-view bg-light p-3 rounded overflow-auto"
    >
      <div *ngFor="let key of returnKeys" class="d-flex align-items-start mb-2">
        <strong class="me-2">{{ key }}:</strong>
        <span *ngIf="isPrimitive(returns[key])">{{ returns[key] }}</span>
        <ngx-json-viewer
          *ngIf="!isPrimitive(returns[key])"
          [json]="returns[key]"
          [expanded]="true"
        ></ngx-json-viewer>
      </div>
    </div>
    <div
      *ngIf="responseView === 'json' && copied"
      class="alert alert-success mt-2 p-1 py-2"
      role="alert"
    >
      Copied!
    </div>
  </div>
</div>
