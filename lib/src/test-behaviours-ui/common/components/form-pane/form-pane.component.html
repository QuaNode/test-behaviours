<div class="container-fluid">
  <div class="row align-items-center g-3">
    <div class="col-12 col-md-2">
      <select
        class="form-select form-select-sm border-0 rounded-0 bg-light"
        style="height: 40px;">
        <option selected>Get</option>
        <option value="1">Post</option>
        <option value="2">Put</option>
        <option value="3">Patch</option>
        <option value="4">Delete</option>
        <option value="5">Copy</option>
        <option value="6">Link</option>
      </select>
    </div>
    <div class="col-12 col-md-8">
      <div class="input-group input-group-sm">
        <input type="text" 
               class="form-control border-0 rounded-0 bg-light"
               placeholder="Enter request URL"
               style="height: 40px;">
      </div>
    </div>
    <div class="col-12 col-md-2">
      <div class="d-grid">
        <div class="dropdown">
          <button
            class="btn btn-dark dropdown-toggle"
            type="button"
            data-bs-toggle="dropdown"
            aria-expanded="false">
            Send
          </button>
          <ul class="dropdown-menu">
            <li><button class="dropdown-item text-dark" type="button">Send And Download</button></li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <div class="mt-4">
    <app-json-text-area></app-json-text-area>
  </div>
</div>
