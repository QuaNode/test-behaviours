<div class="row mt-3">
  <div class="d-grid d-lg-flex m-auto gap-lg-3">
    <div class="col-md-2 m-md-auto">
      <select
        class="form-select p-2 mb-3 mt-3 border-secondary-subtle fw-bold"
        [class]="methodClass()"
        disabled
      >
        <option selected>
          {{ requestData().method }}
        </option>
      </select>
    </div>
    <div class="col-md-8 m-md-auto">
      <input
        type="text"
        class="form-control mb-3 mt-3 p-2"
        [value]="requestData().url"
        placeholder="Enter request url"
        disabled
      />
    </div>

    <div class="row gap-sm-4 gap-md-0 text-center">
      <div class="col-sm-10 col-lg-12 m-auto">
        <div class="btn-group w-100">
          <button
            class="btn send-btn dropdown-toggle text-white"
            type="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            Send
          </button>
          <ul class="dropdown-menu">
            <li>
              <button class="dropdown-item text-dark" type="button">
                Send And Download
              </button>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  @if (requestData().isValid) {
  <div
    class="d-flex flex-wrap align-items-center gap-3 mt-3 px-2 justify-content-center"
  >
    <span class="badge text-bg-light"
      ><strong>Version:</strong>
      <span class="span1">{{ requestData().version }}</span></span
    >
    <span class="badge text-bg-light"
      ><strong>Prefix:</strong>
      <span class="span1">{{ requestData().prefix }}</span></span
    >
    <span class="badge text-bg-light"
      ><strong>Events:</strong>
      <span class="span1">{{ requestData().events }}</span></span
    >
  </div>
  }

  <div class="mt-5 mb-5">
    <app-json-text-area></app-json-text-area>
  </div>
</div>
